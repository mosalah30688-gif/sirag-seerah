<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>محمد رسول الله — من الغار إلى الوداع</title>
<link rel="icon" href="./icon-512.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;700;900&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--green:#0f3d2e;--gold:#c8a84a;--cream:#fdfcf6;--sand:#f5efe0;--ink:#1a1a1a}
  body{font-family:'Tajawal',system-ui;background:var(--cream);color:var(--ink);overflow-x:hidden}
  /* HERO - الراية */
  .hero{background:#0a0a0a;color:#fff;min-height:58vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px 16px;position:relative;overflow:hidden}
  .hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 30% 20%,#1a3a2a 0%,#000 70%);opacity:.9}
  .hero>*{position:relative;z-index:1}
  .seal-wrap{display:flex;flex-direction:column;align-items:center;gap:14px}
  .seal{width:148px;height:148px;border-radius:50%;overflow:hidden;border:3px solid #c8a84a;box-shadow:0 0 0 6px rgba(200,168,74,.12),0 12px 30px rgba(0,0,0,.5);background:#b89a4a}
  .seal img{width:100%;height:100%;object-fit:cover;display:block;filter:contrast(1.05)}
  .seal-title{font-family:'Amiri',serif;font-weight:900;line-height:.85;text-align:center}
  .seal-title span{display:block;letter-spacing:1px}
  .seal-title span:nth-child(1){font-size:44px;color:#fff3b8}
  .seal-title span:nth-child(2){font-size:44px;color:#fff}
  .seal-title span:nth-child(3){font-size:46px;color:#fff}
  .hero p{margin-top:18px;color:#c8a84a;letter-spacing:4px;font-size:13px;font-weight:700}
  .hero .sub{color:#aaa;font-size:13px;margin-top:6px;letter-spacing:.5px;line-height:1.6;max-width:520px}
  .hero .cta{margin-top:22px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .btn{border:none;border-radius:999px;padding:12px 26px;font-family:'Tajawal';font-weight:800;cursor:pointer;font-size:14px;transition:.2s}
  .btn-gold{background:var(--gold);color:#000}
  .btn-gold:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(200,168,74,.4)}
  .btn-ghost{background:transparent;color:#fff;border:1px solid #444}
  .stats{display:flex;gap:18px;justify-content:center;margin-top:18px;font-size:12px;color:#888}
  .stats b{color:#fff3b8}
  /* NAV */
  .topbar{position:sticky;top:0;z-index:20;background:rgba(253,252,246,.92);backdrop-filter:blur(8px);border-bottom:1px solid #e8e0c8;display:flex;align-items:center;gap:8px;padding:10px 12px;overflow-x:auto}
  .chip{white-space:nowrap;border:1px solid #e8e0c8;background:#fff;border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:700;cursor:pointer}
  .chip.active{background:var(--green);color:#fff;border-color:var(--green)}
  .search{margin-left:auto;display:flex;align-items:center;gap:6px;background:#fff;border:1px solid #e8e0c8;border-radius:999px;padding:6px 12px;min-width:160px}
  .search input{border:none;outline:none;font-family:'Tajawal';font-size:13px;width:100%;background:transparent}
  /* TIMELINE */
  .wrap{max-width:860px;margin:0 auto;padding:18px 14px}
  .section-head{display:flex;align-items:center;gap:10px;margin:28px 0 14px}
  .section-head h2{font-size:15px;font-weight:900;color:var(--green);background:var(--sand);padding:6px 14px;border-radius:999px;border:1px solid #e8e0c8}
  .section-head .line{flex:1;height:1px;background:#e8e0c8}
  .timeline{position:relative;padding-right:22px}
  .timeline::before{content:'';position:absolute;right:7px;top:0;bottom:0;width:3px;background:linear-gradient(var(--gold),var(--green));border-radius:99px;opacity:.25}
  .event{position:relative;background:#fff;border:1px solid #ece6d3;border-radius:18px;padding:14px 14px 12px;margin:14px 0;box-shadow:0 2px 10px rgba(0,0,0,.04);cursor:pointer;transition:.15s}
  .event:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(0,0,0,.07);border-color:#d9cdaa}
  .event::before{content:'';position:absolute;right:-22px;top:18px;width:13px;height:13px;background:var(--gold);border:3px solid var(--cream);border-radius:50%;box-shadow:0 0 0 3px rgba(200,168,74,.15)}
  .event.live{border-color:#c8a84a;box-shadow:0 0 0 3px rgba(200,168,74,.12)}
  .event.live::before{background:var(--green);animation:pulse 2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(15,61,46,.35)}70%{box-shadow:0 0 0 9px rgba(15,61,46,0)}100%{box-shadow:0 0 0 0 rgba(15,61,46,0)}}
  .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:11px}
  .badge{padding:3px 8px;border-radius:999px;font-weight:800}
  .b-hijri{background:var(--green);color:#fff}
  .b-greg{background:#fff3b8;color:#5a4a12;border:1px solid #e8d9a0}
  .b-place{background:#fff;border:1px solid #e8e0c8;color:#6b5d2e}
  .event h3{font-size:17px;font-weight:900;margin:8px 0 6px;color:#0f2a20;line-height:1.3}
  .event p{font-size:13.5px;line-height:1.7;color:#3a3a3a;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .event .foot{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
  .ayah-tag{font-family:'Amiri',serif;background:#0f3d2e;color:#fff3b8;padding:4px 10px;border-radius:999px;font-size:11px}
  .sahaba{font-size:11px;color:#7a6a3a}
  .open-hint{margin-left:auto;font-size:11px;color:#999}
  /* DRAWER */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:30}
  .overlay.open{display:block}
  .drawer{position:fixed;inset:0 0 0 auto;width:min(560px,100%);background:var(--cream);z-index:31;transform:translateX(100%);transition:.3s;overflow:auto;border-left:1px solid #e8e0c8}
  .drawer.open{transform:translateX(0)}
  .drawer-head{position:sticky;top:0;background:var(--cream);padding:14px;border-bottom:1px solid #e8e0c8;display:flex;align-items:center;gap:10px}
  .drawer-body{padding:18px}
  .drawer-body h3{font-size:22px;font-weight:900;color:var(--green)}
  .drawer-body .big-meta{margin:10px 0;display:flex;gap:6px;flex-wrap:wrap}
  .drawer-body p{font-size:15px;line-height:1.9;color:#222;margin:12px 0}
  .qbox{background:#fff;border:1px solid #ece6d3;border-radius:14px;padding:12px;margin:14px 0}
  .qbox h4{font-size:13px;color:var(--green);margin-bottom:6px}
  .qbox button{width:100%;text-align:right;background:#fdfcf6;border:1px solid #e8e0c8;border-radius:10px;padding:10px 12px;margin:6px 0;font-family:'Tajawal';cursor:pointer}
  .qbox button.correct{background:#e6f4ea;border-color:#a3d9b1}
  .qbox button.wrong{background:#fde8e8;border-color:#f5b5b5}
  .mapbox{height:180px;background:linear-gradient(135deg,#0f3d2e,#1a5a3a);border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff3b8;position:relative;overflow:hidden}
  .progress{height:8px;background:#ece6d3;border-radius:999px;overflow:hidden;margin:10px 0}
  .progress i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--green));width:0}
  /* HIFZ */
  .hifz-card{background:#0f3d2e;color:#fff;border-radius:16px;padding:14px;margin:14px 0}
  .hifz-card button{background:#fff3b8;color:#0f3d2e;border:none;border-radius:999px;padding:8px 14px;font-weight:800;cursor:pointer;margin-top:8px}
  .nasab-tree{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px}
  .nasab-node{background:#fff;border:1px solid #ece6d3;border-radius:10px;padding:8px 14px;font-size:13px;font-weight:800;min-width:140px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.04)}
  .nasab-node.prophet{background:var(--green);color:#fff3b8;border-color:var(--green);font-size:15px}
  .nasab-line{width:2px;height:14px;background:var(--gold);opacity:.5}
  .nasab-branch{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .nasab-branch .nasab-node{flex:1;min-width:110px;font-size:12px}
  footer{text-align:center;padding:30px 12px;color:#999;font-size:12px}
  @media(min-width:900px){.hero{padding:42px}.rayah h1{font-size:62px}.wrap{padding:24px}}
</style>
</head>
<body>

<div class="hero">
  <div class="seal-wrap">
    <div class="seal"><img src="./seal.png" alt="خاتم النبي - محمد رسول الله"></div>
  </div>

  <div class="cta">
    <button class="btn btn-gold" onclick="document.querySelector('.topbar').scrollIntoView({behavior:'smooth'})">ابدأ الرحلة الآن ↓</button>
    <button class="btn btn-ghost" onclick="openNasab()">🌳 شجرة النسب</button>
    <button class="btn btn-ghost" onclick="toggleHifz()">🧠 حفظي</button>
  </div>
  <div class="stats"><span>⏳ <b id="statCount">300</b> حدث موسوعي</span></div>
</div>

<div class="topbar">
  <button class="chip active" data-filter="all" onclick="filterPhase('all',this)">الكل</button>
  <button class="chip" data-filter="المولد والنشأة" onclick="filterPhase('المولد والنشأة',this)">المولد</button>
  <button class="chip" data-filter="البعثة - مكة سراً" onclick="filterPhase('البعثة - مكة سراً',this)">البعثة</button>
  <button class="chip" data-filter="الجهر والاضطهاد" onclick="filterPhase('الجهر والاضطهاد',this)">الجهر</button>
  <button class="chip" data-filter="الهجرة" onclick="filterPhase('الهجرة',this)">الهجرة</button>
  <button class="chip" data-filter="الغزوات" onclick="filterPhase('الغزوات',this)">الغزوات</button>
  <button class="chip" data-filter="الفتح الأعظم" onclick="filterPhase('الفتح الأعظم',this)">الفتح</button>
  <button class="chip" data-filter="الوداع" onclick="filterPhase('الوداع',this)">الوداع</button>
  <label class="search">🔍 <input id="q" placeholder="ابحث: بدر، خديجة، 2 هـ" oninput="render()"></label>
</div>

<div style="max-width:860px;margin:0 auto;padding:14px 14px 0"><div id="todayCard" style="background:linear-gradient(135deg,#0f3d2e,#1e5a3a);color:#fff;border-radius:16px;padding:14px;display:flex;gap:12px;align-items:center;cursor:pointer;min-height:72px" onclick="if(window._todayId) openEvent(window._todayId)"><div style="width:48px;height:48px;border-radius:50%;background:#fff3b8;color:#0f3d2e;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0">📅</div><div style="flex:1;min-width:0"><div style="font-size:11px;opacity:.8">عِش اليوم — جاري التحميل...</div><div style="font-weight:900;margin:4px 0">...</div></div><div style="font-size:18px">←</div></div></div>
<div class="wrap" id="wrap"></div>

<div class="overlay" id="overlay" onclick="closeDrawer();closeNasab()"></div>
<div class="drawer" id="nasabDrawer" style="width:min(640px,100%)">
  <div class="drawer-head">
    <button class="btn btn-ghost" style="color:#000;border-color:#ddd" onclick="closeNasab()">✕ إغلاق</button>
    <strong style="margin-right:auto">🌳 شجرة النسب الشريف</strong>
  </div>
  <div class="drawer-body" id="nasabBody"></div>
</div>
<div class="drawer" id="drawer">
  <div class="drawer-head">
    <button class="btn btn-ghost" style="color:#000;border-color:#ddd" onclick="closeDrawer()">✕ إغلاق</button>
    <strong id="dTitle" style="margin-right:auto"></strong>
    <button class="btn btn-gold" style="padding:8px 14px" onclick="shareEvent()">مشاركة</button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
</div>

<footer style="text-align:center;padding:20px;color:#999;font-size:11px">ﷺ</footer>

<script>
let data=[],maps={},ayahs={};
let active='all';
let opened=null;
let hifz=new Set(JSON.parse(localStorage.getItem('seerah_hifz')||'[]'));
function saveHifz(){localStorage.setItem('seerah_hifz',JSON.stringify([...hifz]))}
async function load(){
  const r=await fetch('./data/seerah.json'); data=await r.json();
  try{ const m=await fetch('./data/maps.json'); maps=await m.json(); }catch(e){}
  try{ const a=await fetch('./data/ayahs.json'); ayahs=await a.json(); }catch(e){}
  // تحديث العداد
  const sc=document.getElementById('statCount'); if(sc) sc.textContent=data.length;
  render();
  renderToday();
}
function renderToday(){
  const el=document.getElementById('todayCard');
  if(!el || !data.length) return;
  // التاريخ الهجري (أم القرى) هو الأساس في السيرة — اليوم جمادى الأولى 1448
  let hDay=14,hMonth=5,hYear='1448',hStr='',hMonthName='جمادى الأولى';
  const mNames=['محرم','صفر','ربيع الأول','ربيع الآخر','جمادى الأولى','جمادى الآخرة','رجب','شعبان','رمضان','شوال','ذو القعدة','ذو الحجة'];
  const mShort=['محرم','صفر','ربيع1','ربيع2','جمادى1','جمادى2','رجب','شعبان','رمضان','شوال','ذو القعدة','ذو الحجة'];
  try{
    const toLatn=s=>s.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[^\d]/g,'');
    const fmt=new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura',{day:'numeric',month:'numeric',year:'numeric'});
    const parts=fmt.formatToParts(new Date());
    hDay=parseInt(toLatn(parts.find(p=>p.type==='day').value))||hDay;
    hMonth=parseInt(toLatn(parts.find(p=>p.type==='month').value))||hMonth;
    hYear=toLatn(parts.find(p=>p.type==='year').value)||hYear;
    hMonthName=mNames[hMonth-1]||hMonthName;
    hStr=`${hDay} ${hMonthName} ${hYear}هـ`;
  }catch(e){ hStr=new Date().toLocaleDateString('ar-EG'); }
  const idx=(hDay + hMonth*3) % data.length;
  const e=data[idx];
  window._todayId=e.id;
  // أيقونة التاريخ الحقيقي - رقم اليوم الهجري
  el.innerHTML=`<div style="width:52px;height:52px;border-radius:12px;background:#fff;color:#0f3d2e;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;flex-shrink:0;border:1px solid #e8e0c8;box-shadow:0 2px 8px rgba(0,0,0,.1)"><div style="font-size:20px;font-weight:900">${hDay}</div><div style="font-size:8px;font-weight:800;opacity:.7;margin-top:1px">${mShort[hMonth-1]}</div></div>
    <div style="flex:1;min-width:0"><div style="font-size:11px;opacity:.8">عِش اليوم — ${hStr}</div><div style="font-weight:900;margin:4px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${e.title}</div><div style="font-size:12px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${e.desc.slice(0,60)}...</div></div>
    <div style="font-size:18px;opacity:.9">←</div>`;
  el.onclick=()=>{ const ev=data.find(x=>x.id===window._todayId); if(ev) openEvent(ev.id); else alert('جاري التحميل...'); };
  el.style.cursor='pointer';
}
function renderMap(e){
  const P={
    "مكة":[360,165],"الكعبة":[360,165],"المسجد الحرام":[360,165],"بطحاء مكة":[360,165],
    "المدينة":[200,55],"المسجد النبوي":[200,55],"حجرة عائشة":[200,55],"قباء":[215,70],"المدينة — حجرة عائشة":[200,55],
    "بدر":[250,105],"العقبة — منى":[350,145],"منى":[350,150],"عرفة":[365,155],"مزدلفة":[355,153],"الحديبية":[345,160],"الجعرانة":[365,145],
    "أحد":[205,68],"جبل أحد":[205,68],"حمراء الأسد":[195,75],"الخندق":[200,60],"خيبر":[220,35],"فدك":[240,45],"وادي القرى":[230,40],
    "تبوك":[165,18],"أيلة":[150,30],"مؤتة — الأردن":[140,55],"مؤتة":[140,55],"الشام":[160,20],"بصرى الشام":[170,22],"نجران":[340,230],"اليمن":[330,250],
    "الحبشة":[80,220],"الطائف":[375,145],"الطائف ومكة":[365,155],"حنين":[340,135],"حنين والطائف":[355,140],"ذات الرقاع":[260,85],"دومة الجندل":[180,15],"نجد":[270,95],"بني سعد":[345,175],
    "قديد":[300,135],"عسفان":[330,150],"رابغ":[255,95],"الأبواء":[240,80],"المريسيع":[260,115],"بني المصطلق":[260,115],
    "فارس → المدينة":[380,60],"الرجيع":[335,160],"بئر معونة":[280,70],"شعب أبي طالب":[358,165],"دار الأرقم":[360,165],"الصفا":[360,165]
  };
  function coord(place){
    if(P[place]) return P[place];
    for(let k in P){ if(place.includes(k) || k.includes(place)) return P[k]; }
    return [275,110];
  }
  const c=coord(e.place);
  const isHijra = e.type==="hijra" || e.title.includes("هجرة")|| e.title.includes("الهجرة");
  const isBattle = e.type==="battle";
  const isMeet = e.type==="meet"||e.type==="treaty";
  let extra="";
  if(e.id===19 || e.hijri==="1 هـ" && e.title.includes("الهجرة")){
    extra=`<path d="M360 165 C320 120 260 80 200 55" fill="none" stroke="#c8a84a" stroke-width="2.5" stroke-dasharray="7 5"/><circle cx="360" cy="165" r="7" fill="#fff" stroke="#c8a84a" stroke-width="2"/><circle cx="200" cy="55" r="7" fill="#fff" stroke="#c8a84a" stroke-width="2"/><text x="322" y="95" fill="#fff3b8" font-size="8" font-family="Tajawal" text-anchor="middle">450 كم — 8 أيام</text>`;
  } else if(isBattle){
    extra=`<circle cx="${c[0]}" cy="${c[1]}" r="18" fill="none" stroke="#c8a84a" stroke-width="1.2" opacity="0.5"/><circle cx="${c[0]}" cy="${c[1]}" r="26" fill="none" stroke="#c8a84a" stroke-width="0.8" opacity="0.25"/>`;
  } else if(isMeet){
    extra=`<circle cx="${c[0]}" cy="${c[1]}" r="14" fill="none" stroke="#fff3b8" stroke-width="1" stroke-dasharray="4 3"/>`;
  }
  const bg=`<defs><linearGradient id="g${e.id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0f3d2e"/><stop offset="100%" stop-color="#163d2e"/></linearGradient></defs><rect width="450" height="180" rx="14" fill="url(#g${e.id})"/>`;
  const grid=`<path d="M0 45 H450 M0 90 H450 M0 135 H450 M115 0 V180 M230 0 V180 M345 0 V180" stroke="#fff" stroke-width="0.4" opacity="0.07"/>`;
  const dot=`<circle cx="${c[0]}" cy="${c[1]}" r="7" fill="#fff3b8" stroke="#c8a84a" stroke-width="2"/>`;
  const label=`<g><rect x="${c[0]-38}" y="${c[1]+12}" width="76" height="18" rx="9" fill="#0f3d2e" stroke="#c8a84a" stroke-width="0.8" opacity="0.95"/><text x="${c[0]}" y="${c[1]+24}" fill="#fff3b8" font-size="9" font-family="Tajawal" text-anchor="middle" font-weight="800">${e.place.length>18?e.place.slice(0,18):e.place}</text></g>`;
  const title=`<text x="10" y="16" fill="#c8a84a" font-size="8" font-family="Tajawal" font-weight="800">${e.hijri} • ${e.phase}</text><text x="440" y="16" fill="#fff" font-size="7" font-family="Tajawal" opacity="0.6" text-anchor="end">${e.id}/300</text>`;
  return `<svg viewBox="0 0 450 180" style="width:100%;height:100%"><g>${bg}${grid}${extra}${dot}${label}${title}</g></svg>`;
}
function filterPhase(p,el){
  active=p;
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active'); render();
}
function render(){
  const q=(document.getElementById('q').value||'').trim();
  const wrap=document.getElementById('wrap');
  let list=data.filter(e=>{
    if(active!=='all' && !e.phase.includes(active) && e.phase!==active) return false;
    if(q && !(e.title.includes(q)||e.desc.includes(q)||e.place.includes(q)||e.hijri.includes(q))) return false;
    return true;
  });
  // group by phase
  let html='';
  let cur='';
  let done=0;
  list.forEach(e=>{
    if(e.phase!==cur){ cur=e.phase; html+=`<div class="section-head"><h2>${cur}</h2><div class="line"></div></div><div class="timeline">`}
    const isHifz=hifz.has(e.id);
    const isLive=e.id===22; // بدر live demo
    html+=`<div class="event ${isLive?'live':''}" onclick="openEvent(${e.id})">
      <div class="meta">
        <span class="badge b-hijri">${e.hijri}</span>
        <span class="badge b-greg">${e.greg}</span>
        <span class="badge b-place">📍 ${e.place}</span>
        ${isHifz?'🔖 محفوظ':''}
      </div>
      <h3>${e.title}</h3>
      <p>${e.desc}</p>
      <div class="foot">
        ${e.ayah?`<span class="ayah-tag">﴿ ${e.ayah} ﴾</span>`:''}
        ${e.sahaba.length?`<span class="sahaba">👤 ${e.sahaba.join(' • ')}</span>`:''}
        <span class="open-hint">افتح ←</span>
      </div>
    </div>`;
    done++;
    // close timeline group when next phase different
    const next=list[list.indexOf(e)+1];
    if(!next || next.phase!==cur) html+=`</div>`;
  });
  if(!list.length) html='<p style="text-align:center;color:#999;padding:40px">لا نتائج</p>';
  // hifz card top
  const hifzCard=`<div class="hifz-card">
    <div style="font-weight:900">🧠 حفظي الذكي — ${hifz.size} أحداث</div>
    <div style="font-size:12px;opacity:.9;margin-top:4px">نظام 1-3-7-14-30 سيذكرك تلقائياً. احفظ أي حدث وسيظهر هنا.</div>
    <div class="progress"><i id="prog" style="width:${Math.min(100,Math.round(hifz.size/data.length*100))}%"></i></div>
    <div style="font-size:12px">${hifz.size}/${data.length} — ${Math.round(hifz.size/data.length*100)}%</div>
  </div>`;
  wrap.innerHTML=hifzCard+html;
}
function openEvent(id){
  const e=data.find(x=>x.id===id); if(!e) return; opened=e;
  document.getElementById('dTitle').textContent=e.title;
  const body=document.getElementById('drawerBody');
  const isHifz=hifz.has(e.id);
  body.innerHTML=`
    <div class="big-meta">
      <span class="badge b-hijri">${e.hijri}</span><span class="badge b-greg">${e.greg}</span><span class="badge b-place">📍 ${e.place}</span>
      <span class="badge" style="background:${isHifz?'#0f3d2e':'#fff'};color:${isHifz?'#fff':'#0f3d2e'};border:1px solid #0f3d2e">${isHifz?'🔖 محفوظ':'☆ حفظ'}</span>
    </div>
    <h3>${e.title}</h3>
    <p>${e.desc}</p>
    ${e.ayah&&ayahs[e.ayah]?`<div class="qbox" style="background:#fdfcf6;border-color:#ece6d3"><h4 style="color:#0f3d2e">📖 الآية المرتبطة — ${e.ayah}</h4><p style="font-family:'Amiri',serif;font-size:19px;line-height:1.8;color:#0f3d2e;text-align:center">﴿ ${ayahs[e.ayah]} ﴾</p></div>`:''}
    <div class="mapbox" style="height:190px;padding:0;overflow:hidden;background:#0f3d2e">${renderMap(e)}</div>
    <div class="qbox" id="quizBox">
      <h4>🎯 محاكي القرار — اختبر فهمك</h4>
      <div id="quizQ"></div>
    </div>
    <div style="display:flex;gap:8px;margin-top:14px">
      <button class="btn btn-gold" style="flex:1" onclick="toggleSave(${e.id})">${isHifz?'إلغاء الحفظ':'🧠 احفظ للمراجعة'}</button>
      <button class="btn btn-ghost" style="flex:1;color:#000;border-color:#ddd" onclick="nextEvent()">التالي →</button>
    </div>
  `;
  loadQuiz(e);
  document.getElementById('drawer').classList.add('open');
  document.getElementById('overlay').classList.add('open');
}
function loadQuiz(e){
  const qmap={
    7:{q:"ماذا نزل أولاً في غار حراء؟",opts:["اقرأ باسم ربك","الحمد لله","قل هو الله أحد"],a:0,info:"اقرأ باسم ربك الذي خلق — أول آية."},
    19:{q:"كم يوم مكث النبي في غار ثور؟",opts:["يوم","3 أيام","أسبوع"],a:1,info:"3 أيام حتى يهدأ الطلب."},
    22:{q:"كم كان عدد المسلمين في بدر؟",opts:["313","1000","700"],a:0,info:"313 ثبتوا فنصرهم الله."},
    23:{q:"لماذا هُزم المسلمون أولاً في أحد؟",opts:["قلة العدد","مخالفة الرماة","خيانة"],a:1,info:"الرماة تركوا الجبل لجمع الغنائم."},
    31:{q:"ماذا قال النبي لأهل مكة يوم الفتح؟",opts:["اقتلوهم","اذهبوا فأنتم الطلقاء","ادفعوا الجزية"],a:1,info:"عفو نبوي لم يشهده التاريخ."},
    38:{q:"من رأى رؤيا الأذان؟",opts:["عبد الله بن زيد","بلال","عمر"],a:0,info:"عبد الله بن زيد ثم أقره النبي."},
    42:{q:"متى فُرض الصيام؟",opts:["1 هـ","2 هـ","3 هـ"],a:1,info:"2 هـ — ﴿كتب عليكم الصيام﴾"},
    47:{q:"في أي حادثة برأ الله عائشة؟",opts:["الإفك","بدر","أحد"],a:0,info:"﴿إن الذين جاءوا بالإفك﴾"},
    49:{q:"كم بايع تحت الشجرة في بيعة الرضوان؟",opts:["700","1400","3000"],a:1,info:"1400 — ﴿لقد رضي الله عن المؤمنين﴾"},
    50:{q:"ماذا فعل كسرى بكتاب النبي؟",opts:["مزقه","قبّله","أخفاه"],a:0,info:"مزقه فمزق الله ملكه."}
  };
  const qq=qmap[e.id]||{q:`ما أهم دروس "${e.title}"؟`,opts:["الصبر","الشجاعة","الحكمة"],a:2,info:"كل أحداث السيرة مدرسة في الحكمة والثبات."};
  const box=document.getElementById('quizQ');
  box.innerHTML=`<div style="font-weight:800;margin-bottom:6px">${qq.q}</div>`+qq.opts.map((o,i)=>`<button onclick="answerQuiz(${i},${qq.a},'${qq.info}')">${o}</button>`).join('');
}
function answerQuiz(chosen,ans,info){
  document.querySelectorAll('#quizQ button').forEach((b,i)=>{
    b.classList.remove('correct','wrong');
    if(i===ans) b.classList.add('correct');
    else if(i===chosen) b.classList.add('wrong');
  });
  const c=document.getElementById('quizQ');
  const p=document.createElement('div'); p.style.cssText='margin-top:8px;background:#fff3b8;padding:8px;border-radius:8px;font-size:13px'; p.textContent='💡 '+info; c.appendChild(p);
}
const NASAB = {"prophet":{"name":"محمد ﷺ","line":["عدنان","معد","نزار","مضر","إلياس","مدركة","خزيمة","كنانة","النضر (قريش)","مالك","فهر","غالب","لؤي","كعب","مرة","كلاب","قصي","عبد مناف","هاشم","عبد المطلب","عبد الله","محمد ﷺ"],"father":"عبد الله بن عبد المطلب","mother":"آمنة بنت وهب","grandfather":"عبد المطلب بن هاشم","uncle":["أبو طالب","حمزة","العباس","أبو لهب"],"wives":["خديجة","سودة","عائشة","حفصة","زينب","أم سلمة","جويرية","ميمونة","صفية","زينب بنت جحش"],"children":["القاسم","عبد الله","إبراهيم","زينب","رقية","أم كلثوم","فاطمة"]}};
function closeDrawer(){document.getElementById('drawer').classList.remove('open');if(!document.getElementById('nasabDrawer').classList.contains('open')) document.getElementById('overlay').classList.remove('open')}
function closeNasab(){document.getElementById('nasabDrawer').classList.remove('open');if(!document.getElementById('drawer').classList.contains('open')) document.getElementById('overlay').classList.remove('open')}
function openNasab(){
  const body=document.getElementById('nasabBody');
  const p=NASAB.prophet;
  body.innerHTML=`
      <div style="text-align:center;color:#6b5d2e;font-size:12px">النسب الشريف من عدنان إلى محمد ﷺ</div>
      <div class="nasab-tree">
        ${p.line.slice().reverse().map((n,i)=>`<div class="nasab-node ${n.includes('محمد')?'prophet':''}">${n}</div>${i<p.line.length-1?'<div class="nasab-line"></div>':''}`).join('')}
      </div>
      <div class="qbox"><h4>👨‍👩‍👧‍👦 الأسرة</h4>
        <div style="font-size:13px;line-height:1.8">
          <b>الأب:</b> ${p.father}<br><b>الأم:</b> ${p.mother}<br><b>الجد:</b> ${p.grandfather}<br>
          <b>الأعمام:</b> ${p.uncle.join(' • ')}<br>
          <b>الزوجات:</b> ${p.wives.join(' • ')}<br>
          <b>الأبناء:</b> ${p.children.join(' • ')}
        </div>
      </div>
      <p style="font-size:11px;color:#888;text-align:center">اللهم صل وسلم على نبينا محمد ﷺ</p>
    `;
  document.getElementById('nasabDrawer').classList.add('open');
  document.getElementById('overlay').classList.add('open');
}
function toggleSave(id){ if(hifz.has(id)) hifz.delete(id); else hifz.add(id); saveHifz(); render(); openEvent(id); }
function toggleHifz(){ filterPhase('all',document.querySelector('[data-filter="all"]')); document.getElementById('q').value=''; render(); alert('محفوظاتك: '+[...hifz].join(', ')||'لا شيء بعد'); }
function nextEvent(){ if(!opened) return; const i=data.findIndex(x=>x.id===opened.id); if(i>=0&&i<data.length-1) openEvent(data[i+1].id); }
function shareEvent(){ if(!opened) return; const t=`${opened.title} — ${opened.hijri} (${opened.place})\n${opened.desc}`; if(navigator.share) navigator.share({title:opened.title,text:t}); else {navigator.clipboard.writeText(t); alert('تم النسخ');}}
load();
</script>
